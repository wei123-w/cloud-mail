name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-06-04"

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
ai_model = "${AI_MODEL}"
analysis_cache = "${ANALYSIS_CACHE}"
#orm_log = false
domain = "${DOMAIN}"
admin = "${ADMIN}"
jwt_secret = "${JWT_SECRET}"
project_link = "${PROJECT_LINK}"
EXTERNAL_GOOGLE_CLIENT_ID = "${EXTERNAL_GOOGLE_CLIENT_ID}"
EXTERNAL_GOOGLE_REDIRECT_URI = "${EXTERNAL_GOOGLE_REDIRECT_URI}"
EXTERNAL_MICROSOFT_CLIENT_ID = "${EXTERNAL_MICROSOFT_CLIENT_ID}"
EXTERNAL_MICROSOFT_REDIRECT_URI = "${EXTERNAL_MICROSOFT_REDIRECT_URI}"
# EXTERNAL_CREDENTIAL_SECRET 和两个客户端密钥通过部署环境的密钥注入

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
